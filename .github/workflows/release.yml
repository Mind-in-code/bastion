name: Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-Platform Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Matrix
        run: |
          mkdir -p dist
          
          # Target Matrix
          platforms=(
            "windows/amd64/bastion-windows-amd64.exe"
            "windows/arm64/bastion-windows-arm64.exe"
            "linux/amd64/bastion-linux-amd64"
            "linux/arm64/bastion-linux-arm64"
            "darwin/arm64/bastion-darwin-arm64"
            "darwin/amd64/bastion-darwin-amd64"
          )

          for target in "${platforms[@]}"; do
            IFS="/" read -r os arch filename <<< "$target"
            echo "Compiling for $os/$arch..."
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o dist/$filename bastion.go
          done

          # Generate SHA-256 Checksums
          cd dist
          sha256sum * > checksums.txt
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}